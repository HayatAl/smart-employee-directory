    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
getUsers();


function getUsers(page=1, limit=3) {
    
        let params = {
        _page: page,
        _limit: limit,
      };

      axios
        .get("https://jsonplaceholder.typicode.com/users", { params })
        .then(function (response) {
          // handle success
          console.log(response.data);
          console.log("test");
          let users = response.data;
          users.forEach((element) => {

            console.log(element);

            const userPhotoUrl = `https://i.pravatar.cc/150?u=${element.id}`;
            let card = `
              <div class="col-12 col-md-4 col-lg-4 user-card">
          <div class="card text-bg-dark mb-3" style="max-width: 18rem">
            <div class="card-header d-flex align-items-start">
              <img
                src="${userPhotoUrl}"
                alt="Profile Image"
                class="img-fluid rounded-circle"
                style="width: 50px; height: 50px"
              />
              <p class="ms-3 mt-3 fw-bold fst-italic">${element.name}</p>
            </div>
            <div class="card-body">
              <h5 class="card-title">${element.company.name}</h5>
              <p class="card-text">
                <i
                  class="fa-regular fa-envelope pe-2"
                  style="color: rgb(255, 255, 255)"
                ></i>
              ${element.email}<br />
                <i
                  class="fas fa-phone pe-2"
                  style="color: rgb(255, 255, 255)"
                ></i>
              ${element.phone}
              </p>
             <a 
  href="http://${element.website}" 
  target="_blank" 
  class="btn btn-primary fw-bold fst-italic" 
  style="background: white; color: black; border-color: white; display: inline-block;"
>
  View Profile
</a>
            </div>
          </div>
        </div>
            `;
     
            document.getElementById("content-contener").innerHTML += card;
          });

          const allCards = document.querySelectorAll('.user-card');
    allCards.forEach((cardElement, index) => {
      setTimeout(() => {
        cardElement.classList.add('show');
      }, index * 150); // كل بطاقة تتأخر عن اللي قبلها
    });
          
        
        })
        .catch(function (error) {
          // handle error
          console.log(error);
        });
}


      function goToSite(url) {
        window.location.href = url;
      }

      function getpage(page){
         document.getElementById("content-contener").innerHTML = "";
         getUsers(page);

      }
    </script>
